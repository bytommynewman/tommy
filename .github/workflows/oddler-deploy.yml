# Deploy Oddler to your own Cloudflare account (oddler.app) on every push.
# Runs on GitHub's machines, so updates go live without any Claude session.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (Settings → Secrets and variables → Actions). Without them the job skips.
name: oddler-deploy
on:
  push:
    branches: [claude/great-meitner-cdyydz]
    paths: ["oddler/**", ".github/workflows/oddler-deploy.yml"]
  workflow_dispatch:
concurrency: { group: oddler-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set yet; skipping deploy."; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != '1'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.skip != '1'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Rules checks
        if: steps.gate.outputs.skip != '1'
        run: bash oddler/app/build-logic.sh
      - name: Install
        if: steps.gate.outputs.skip != '1'
        working-directory: oddler/deploy
        run: npm install --no-audit --no-fund
      - name: Ensure KV namespace
        if: steps.gate.outputs.skip != '1'
        working-directory: oddler/deploy
        run: |
          find_id() { npx wrangler kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>x.title.endsWith("oddler-profiles"));if(n)console.log(n.id)}catch{}})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler kv namespace create oddler-profiles; ID=$(find_id); fi
          [ -n "$ID" ] || { echo "could not find or create the KV namespace"; exit 1; }
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$ID/" wrangler.jsonc
          echo "KV namespace $ID"
      - name: Build and deploy
        if: steps.gate.outputs.skip != '1'
        working-directory: oddler/deploy
        run: npm run deploy
      - name: Smoke test
        if: steps.gate.outputs.skip != '1'
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://oddler.app/ || true)
            [ "$code" = "200" ] && { echo "oddler.app is up"; exit 0; }
            sleep 20
          done
          echo "oddler.app did not return 200 (DNS for a new custom domain can take a few minutes)"; exit 1
