<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Oddler</title>
    <meta name="description" content="Only odd answers score. Seven prompts, 10 seconds each — the rarer your correct answer, the odder your Oddler grows." />
    <meta property="og:title" content="Oddler" />
    <meta property="og:description" content="Only odd answers score. Seven prompts, 10 seconds each — the rarer your correct answer, the odder your Oddler grows." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/art/cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1b1026" />
    <link rel="icon" href="/art/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --plum: #1b1026;
        --purple: #4a2d6b;
        --lilac: #7c5ba6;
        --rust: #e8743b;
        --lime: #b8e62e;
        --cream: #f5e6c8;
        --slate: #8a94a6;
        --pink: #f08ca8;
        --white: #ffffff;
        --ink: var(--cream);
        --dim: rgba(245, 230, 200, 0.62);
        --panel: rgba(27, 16, 38, 0.82);
        --line: rgba(124, 91, 166, 0.55);
        --pixel: "Press Start 2P", ui-monospace, monospace;
        --body: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        --t1: #8a94a6; --t2: #a98ad1; --t3: #7c5ba6; --t4: #e8743b; --t5: #f08ca8; --t6: #b8e62e;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        min-height: 100dvh;
        color: var(--ink);
        font: 17px/1.45 var(--body);
        background: var(--plum) url("/art/bg-grotto.png") center / cover no-repeat fixed;
        image-rendering: pixelated;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed; inset: 0;
        background: radial-gradient(ellipse at 50% 30%, rgba(27,16,38,0.15), rgba(27,16,38,0.75) 75%);
        pointer-events: none;
      }
      img, button, input { image-rendering: pixelated; }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

      #app {
        position: relative;
        max-width: 560px;
        margin: 0 auto;
        padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        display: flex; flex-direction: column; gap: 14px;
        min-height: 100dvh;
      }
      header.top {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        font-family: var(--pixel); font-size: 10px; letter-spacing: 0.02em;
      }
      header.top .brand { display: flex; align-items: center; gap: 10px; }
      header.top .brand img { height: 22px; width: auto; }
      header.top .tag { color: var(--dim); font-family: var(--body); font-size: 13px; }
      .iconbtn {
        background: var(--panel); border: 2px solid var(--line); border-radius: 8px;
        padding: 6px 9px; font-family: var(--pixel); font-size: 10px; color: var(--cream);
      }
      .iconbtn[aria-pressed="true"] { border-color: var(--lime); color: var(--lime); }

      .panel {
        background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
        padding: 16px; backdrop-filter: blur(2px);
      }
      .px { font-family: var(--pixel); line-height: 1.6; }
      h1, h2 { margin: 0; font-family: var(--pixel); font-weight: 400; }
      h1 { font-size: 18px; } h2 { font-size: 12px; color: var(--lime); letter-spacing: 0.04em; }
      p { margin: 0.35em 0; }
      .dim { color: var(--dim); }
      .small { font-size: 14px; }

      .btn {
        display: block; width: 100%; border: 0; border-radius: 10px;
        padding: 16px 18px; font-family: var(--pixel); font-size: 13px; letter-spacing: 0.03em;
        color: var(--plum); background: var(--pink);
        box-shadow: 0 5px 0 #b45a78; transform: translateY(0);
        transition: transform 80ms ease, box-shadow 80ms ease;
      }
      .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b45a78; }
      .btn.lime { background: var(--lime); box-shadow: 0 5px 0 #7c9c1a; }
      .btn.lime:active { box-shadow: 0 1px 0 #7c9c1a; }
      .btn.ghost { background: var(--purple); color: var(--cream); box-shadow: 0 5px 0 #2b1a40; }
      .btn.ghost:active { box-shadow: 0 1px 0 #2b1a40; }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .row { display: flex; gap: 10px; }
      .row > * { flex: 1; }
      .link { background: none; border: 0; color: var(--lime); text-decoration: underline; padding: 6px; font-size: 15px; }

      /* mode tabs */
      .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .tab {
        background: var(--purple); border: 2px solid transparent; border-radius: 10px; padding: 10px 6px;
        font-family: var(--pixel); font-size: 10px; color: var(--cream); line-height: 1.5;
      }
      .tab small { display: block; font-family: var(--body); font-size: 12px; color: var(--dim); margin-top: 4px; }
      .tab[aria-pressed="true"] { background: var(--lilac); border-color: var(--lime); }

      /* colour swatches */
      .swatches { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
      .swatch[aria-pressed="true"] { border-color: var(--lime); box-shadow: 0 0 0 2px var(--plum); }

      /* the creature */
      .oddler {
        position: relative; margin: 0 auto; width: min(60vw, 240px); aspect-ratio: 586 / 478;
        transition: width 300ms ease;
      }
      .oddler.big { width: min(78vw, 330px); }
      .oddler.small { width: min(34vw, 130px); }
      .oddler .base { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
      .oddler .part { position: absolute; transform: translate(-50%, -50%); height: auto; }
      .oddler .part.flip { transform: translate(-50%, -50%) scaleX(-1); }
      .oddler .part.new { animation: pop 500ms cubic-bezier(.2,1.6,.4,1) both; }
      .oddler.idle { animation: bob 2.4s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
      @keyframes pop { 0% { scale: 0; } 100% { scale: 1; } }
      .oddler .part.new.flip { animation: popflip 500ms cubic-bezier(.2,1.6,.4,1) both; }
      @keyframes popflip { 0% { transform: translate(-50%, -50%) scaleX(-1) scale(0); } 100% { transform: translate(-50%, -50%) scaleX(-1) scale(1); } }
      .nest { text-align: center; padding-top: clamp(28px, 10vw, 48px); }
      .oddler { isolation: isolate; }
      /* On the prompt screen the Oddler peeks from the panel's corner so it can
         never push the question or sit under the keyboard. */
      .askfoot { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 2px; }
      .oddler.mini { width: 78px; margin: 0; flex: 0 0 auto; }
      @media (max-height: 600px) {
        .prompt { font-size: 20px; margin: 6px 0 4px; }
        .oddler.mini { display: none; }
      }

      /* play */
      .hud { display: flex; justify-content: space-between; align-items: center; font-family: var(--pixel); font-size: 10px; }
      .hud .score { color: var(--lime); }
      .strikes { letter-spacing: 3px; }
      .chip { display: inline-block; font-family: var(--pixel); font-size: 9px; padding: 5px 8px; border-radius: 6px; background: var(--purple); color: var(--cream); }
      .prompt { font-size: 24px; font-weight: 700; line-height: 1.25; margin: 10px 0 6px; }
      .timer { display: flex; align-items: center; gap: 12px; margin: 10px 0 8px; }
      .timer .bar { flex: 1; height: 12px; background: var(--purple); border-radius: 6px; overflow: hidden; border: 2px solid var(--line); }
      .timer .fill { height: 100%; width: 100%; background: var(--lime); transition: width 250ms linear; }
      .timer .fill.low { background: var(--rust); }
      .timer .secs { font-family: var(--pixel); font-size: 18px; min-width: 2.2em; text-align: right; }
      .timer .secs.low { color: var(--rust); }
      .answer { display: flex; gap: 8px; }
      .answer input {
        flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 10px; padding: 14px 14px;
        background: rgba(27,16,38,0.9); color: var(--white); font-size: 18px;
      }
      .answer input::placeholder { color: var(--dim); }
      .answer button { flex: 0 0 auto; width: auto; padding: 0 18px; font-size: 11px; }
      .tries { min-height: 1.4em; font-size: 14px; color: var(--rust); }
      .tries .ok { color: var(--dim); }

      /* reveal */
      .tier { display: inline-block; font-family: var(--pixel); font-size: 11px; padding: 8px 10px; border-radius: 8px; color: var(--plum); }
      .tier.t0 { background: var(--slate); } .tier.t1 { background: var(--t1); } .tier.t2 { background: var(--t2); }
      .tier.t3 { background: var(--t3); color: var(--cream); } .tier.t4 { background: var(--t4); } .tier.t5 { background: var(--t5); } .tier.t6 { background: var(--t6); }
      .yours { font-size: 22px; font-weight: 700; }
      .pts { font-family: var(--pixel); font-size: 20px; color: var(--lime); }
      .earned { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 10px; border-radius: 10px; background: rgba(124,91,166,0.25); }
      .earned img { width: 56px; height: 56px; object-fit: contain; }
      .odder { margin-top: 10px; font-size: 15px; }
      .odder b { color: var(--cream); }

      /* results */
      .bigscore { font-family: var(--pixel); font-size: 34px; color: var(--lime); line-height: 1.2; }
      .ladder { display: flex; gap: 5px; flex-wrap: wrap; margin: 10px 0; }
      .ladder span { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-family: var(--pixel); font-size: 9px; color: var(--plum); }
      .history { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
      .history li { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid rgba(124,91,166,0.35); padding-top: 6px; }
      .history li span:last-child { white-space: nowrap; }
      .best { font-family: var(--pixel); font-size: 10px; color: var(--dim); }
      .best.new { color: var(--lime); }

      /* tutorial */
      .tut .ex { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
      .tut .ex button { background: var(--purple); border: 2px solid var(--line); border-radius: 10px; padding: 12px; color: var(--cream); font-size: 16px; }
      .tut .ex button[aria-pressed="true"] { border-color: var(--lime); }
      .ladderlist { display: grid; gap: 5px; margin: 10px 0; font-size: 14px; }
      .ladderlist div { display: flex; justify-content: space-between; align-items: center; }

      .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--lime); color: var(--plum); font-family: var(--pixel); font-size: 10px; padding: 10px 14px; border-radius: 8px; opacity: 0; transition: opacity 200ms; pointer-events: none; z-index: 10; }
      .toast.show { opacity: 1; }
      #status { font-family: var(--pixel); font-size: 9px; color: var(--dim); text-align: center; }
      #status.error { color: var(--rust); }
      @media (prefers-reduced-motion: reduce) {
        .oddler.idle, .oddler .part.new { animation: none; }
        .timer .fill, .oddler { transition: none; }
      }
      @media (min-width: 700px) {
        body { font-size: 18px; }
        .prompt { font-size: 28px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand">
          <img src="/art/logo.png" alt="Oddler" />
          <span class="tag">only odd answers score</span>
        </div>
        <button id="mute" class="iconbtn" type="button" aria-pressed="true" aria-label="Sound on">♪</button>
      </header>
      <main id="screen" aria-live="polite"></main>
      <p id="status"></p>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/client.js"></script>
  </body>
</html>
