<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Oddler</title>
    <meta name="description" content="Only odd answers score. Seven prompts, 10 seconds each — the rarer your correct answer, the odder your Oddler grows. Play solo or Duo with a friend." />
    <meta property="og:title" content="Oddler" />
    <meta property="og:description" content="Only odd answers score. Seven prompts, 10 seconds each — the rarer your correct answer, the odder your Oddler grows. Play solo or Duo with a friend." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/art/cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1b1026" />
    <link rel="icon" href="/art/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --plum: #1b1026;
        --purple: #4a2d6b;
        --lilac: #7c5ba6;
        --rust: #e8743b;
        --lime: #b8e62e;
        --cream: #f5e6c8;
        --slate: #8a94a6;
        --pink: #f08ca8;
        --white: #ffffff;
        --ink: var(--cream);
        --dim: rgba(245, 230, 200, 0.62);
        --panel: rgba(27, 16, 38, 0.82);
        --line: rgba(124, 91, 166, 0.55);
        --pixel: "Press Start 2P", ui-monospace, monospace;
        --body: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        --t1: #8a94a6; --t2: #a98ad1; --t3: #7c5ba6; --t4: #e8743b; --t5: #f08ca8; --t6: #b8e62e;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        min-height: 100dvh;
        color: var(--ink);
        font: 17px/1.45 var(--body);
        background: var(--plum) url("/art/bg-grotto.png") center / cover no-repeat fixed;
        image-rendering: pixelated;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed; inset: 0;
        background: radial-gradient(ellipse at 50% 30%, rgba(27,16,38,0.15), rgba(27,16,38,0.75) 75%);
        pointer-events: none;
      }
      img, button, input { image-rendering: pixelated; }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

      #app {
        position: relative;
        max-width: 560px;
        margin: 0 auto;
        padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        display: flex; flex-direction: column; gap: 14px;
        min-height: 100dvh;
      }
      header.top {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        font-family: var(--pixel); font-size: 10px; letter-spacing: 0.02em;
      }
      header.top .brand { display: flex; align-items: center; gap: 10px; }
      header.top .brand img { height: 22px; width: auto; }
      header.top .tag { color: var(--dim); font-family: var(--body); font-size: 13px; }
      .iconbtn {
        background: var(--panel); border: 2px solid var(--line); border-radius: 8px;
        padding: 6px 9px; font-family: var(--pixel); font-size: 10px; color: var(--cream);
      }
      .iconbtn[aria-pressed="true"] { border-color: var(--lime); color: var(--lime); }

      .panel {
        background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
        padding: 16px; backdrop-filter: blur(2px);
      }
      .px { font-family: var(--pixel); line-height: 1.6; }
      h1, h2 { margin: 0; font-family: var(--pixel); font-weight: 400; }
      h1 { font-size: 18px; } h2 { font-size: 12px; color: var(--lime); letter-spacing: 0.04em; }
      p { margin: 0.35em 0; }
      .dim { color: var(--dim); }
      .small { font-size: 14px; }

      .btn {
        display: block; width: 100%; border: 0; border-radius: 10px;
        padding: 16px 18px; font-family: var(--pixel); font-size: 13px; letter-spacing: 0.03em;
        color: var(--plum); background: var(--pink);
        box-shadow: 0 5px 0 #b45a78; transform: translateY(0);
        transition: transform 80ms ease, box-shadow 80ms ease;
      }
      .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b45a78; }
      .btn.lime { background: var(--lime); box-shadow: 0 5px 0 #7c9c1a; }
      .btn.lime:active { box-shadow: 0 1px 0 #7c9c1a; }
      .btn.ghost { background: var(--purple); color: var(--cream); box-shadow: 0 5px 0 #2b1a40; }
      .btn.ghost:active { box-shadow: 0 1px 0 #2b1a40; }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .row { display: flex; gap: 10px; }
      .row > * { flex: 1; }
      .link { background: none; border: 0; color: var(--lime); text-decoration: underline; padding: 6px; font-size: 15px; }

      /* mode tabs */
      .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .tab {
        background: var(--purple); border: 2px solid transparent; border-radius: 10px; padding: 10px 6px;
        font-family: var(--pixel); font-size: 10px; color: var(--cream); line-height: 1.5;
      }
      .tab small { display: block; font-family: var(--body); font-size: 12px; color: var(--dim); margin-top: 4px; }
      .tab[aria-pressed="true"] { background: var(--lilac); border-color: var(--lime); }

      /* colour swatches */
      .swatches { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
      .swatch[aria-pressed="true"] { border-color: var(--lime); box-shadow: 0 0 0 2px var(--plum); }

      /* the creature */
      .oddler {
        position: relative; margin: 0 auto; width: min(60vw, 240px); aspect-ratio: 586 / 478;
        transition: width 300ms ease;
      }
      .oddler.big { width: min(78vw, 330px); }
      .oddler.small { width: min(34vw, 130px); }
      .oddler .base { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
      /* each part carries its own placement transform in --tf (see anchors.js) */
      .oddler .part { position: absolute; height: auto; }
      .oddler .part.new { animation: pop 500ms cubic-bezier(.2,1.6,.4,1) both; }
      .oddler.idle { animation: bob 2.4s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
      @keyframes pop { 0% { transform: var(--tf) scale(0); } 100% { transform: var(--tf) scale(1); } }
      /* level + locker */
      .levelbar { margin: 10px auto 0; max-width: 360px; text-align: left; }
      .levelrow { display: flex; justify-content: space-between; align-items: center; font-size: 10px; }
      .levelrow .lvl { color: var(--lime); }
      .xp { height: 10px; border-radius: 5px; background: var(--purple); border: 2px solid var(--line); overflow: hidden; margin: 6px 0 4px; }
      .xpfill { height: 100%; background: var(--lime); transition: width 600ms ease; }
      .namefield { display: flex; align-items: center; gap: 10px; margin: 12px auto; max-width: 360px; }
      .namefield input { flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; background: rgba(27,16,38,0.9); color: var(--white); font-size: 16px; }
      .slotgroup { margin-top: 12px; }
      .slothead { display: flex; justify-content: space-between; font-size: 9px; margin-bottom: 6px; }
      .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
      .item { background: var(--purple); border: 2px solid transparent; border-radius: 10px; padding: 8px 4px; color: var(--cream); display: grid; justify-items: center; gap: 4px; }
      .item img { width: 44px; height: 44px; object-fit: contain; }
      .item .iname { font-size: 12px; line-height: 1.2; text-align: center; }
      .item .ihow { font-family: var(--pixel); font-size: 7px; color: var(--dim); text-align: center; line-height: 1.5; }
      .item.worn { border-color: var(--lime); background: rgba(184,230,46,0.14); }
      .item.worn .ihow { color: var(--lime); }
      .item.locked { opacity: 0.45; cursor: default; }
      .item.locked img { filter: grayscale(1) brightness(0.6); }
      .authform { display: grid; gap: 8px; }
      .authform input { border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px; background: rgba(27,16,38,0.9); color: var(--white); font-size: 16px; }
      /* name banners */
      .nameplate { display: inline-block; font-family: var(--pixel); font-size: 10px; letter-spacing: 0.04em; padding: 6px 10px; border-radius: 6px; color: var(--cream); background: var(--purple); border: 2px solid var(--line); vertical-align: middle; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .nameplate.b-lime { border-color: var(--lime); }
      .nameplate.b-stripe { background: repeating-linear-gradient(135deg, #4a2d6b 0 8px, #2b1a40 8px 16px); border-color: var(--rust); }
      .nameplate.b-ember { background: linear-gradient(90deg, #e8743b, #f08ca8); color: var(--plum); border-color: #ffb27a; }
      .nameplate.b-storm { background: linear-gradient(100deg, #4a5566, #8a94a6, #4a5566); background-size: 200% 100%; border-color: #c9d2e0; animation: shimmer 2.4s linear infinite; }
      .nameplate.b-neon { background: var(--plum); color: var(--lime); border-color: var(--lime); box-shadow: 0 0 10px rgba(184,230,46,0.6), inset 0 0 8px rgba(184,230,46,0.25); animation: neon 1.2s ease-in-out infinite alternate; }
      .nameplate.b-holo { background: linear-gradient(90deg, #f08ca8, #b8e62e, #7fe0b0, #b48fe0, #f08ca8); background-size: 300% 100%; color: var(--plum); border-color: #fff; animation: holo 3s linear infinite; }
      .nameplate.b-legend { background: linear-gradient(90deg, #f5d36b, #fff2b0, #e0a62a); background-size: 200% 100%; color: #3a2a00; border-color: #fff5c2; box-shadow: 0 0 14px rgba(245,211,107,0.7); animation: shimmer 1.8s linear infinite; }
      @keyframes shimmer { from { background-position: 0% 0; } to { background-position: 200% 0; } }
      @keyframes holo { from { background-position: 0% 0; } to { background-position: 300% 0; } }
      @keyframes neon { from { box-shadow: 0 0 6px rgba(184,230,46,0.4), inset 0 0 6px rgba(184,230,46,0.2); } to { box-shadow: 0 0 16px rgba(184,230,46,0.9), inset 0 0 10px rgba(184,230,46,0.35); } }
      .banners { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
      .bannerpick { background: var(--purple); border: 2px solid transparent; border-radius: 10px; padding: 10px 6px; display: grid; justify-items: center; gap: 6px; }
      .bannerpick.chosen { border-color: var(--lime); background: rgba(184,230,46,0.14); }
      .bannerpick.locked { opacity: 0.45; cursor: default; }
      .bannerpick.locked .nameplate { filter: grayscale(1); animation: none; }
      .seatname .nameplate { font-size: 9px; padding: 4px 8px; }
      .notice { text-align: center; color: var(--rust); margin: 0 0 8px; }
      .quit { background: none; border: 0; color: var(--dim); font-family: var(--pixel); font-size: 9px; padding: 4px 6px; margin-left: 8px; text-decoration: underline; }
      .quit:hover { color: var(--rust); }
      .xpflash { min-height: 1.2em; margin: 6px 0 0; color: var(--lime); font-size: 12px; text-align: center; opacity: 0; }
      .xpflash.show { animation: flashup 1400ms ease-out both; }
      @keyframes flashup { 0% { opacity: 0; transform: scale(0.6); } 20% { opacity: 1; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
      .fanfare .xp { margin: 8px 0 4px; }
      .fanfare .xpfill { transition: none; }
      .fanfare { margin: 10px auto; padding: 10px; border-radius: 10px; background: rgba(124,91,166,0.25); max-width: 360px; }
      .fanfare.up { background: rgba(184,230,46,0.16); border: 2px solid var(--lime); animation: glow 900ms ease-in-out infinite alternate; }
      .fanfare .px { font-size: 11px; color: var(--lime); margin: 0; }
      .unlocks { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      .unlock { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; background: var(--purple); border-radius: 8px; padding: 4px 8px; }
      .unlock img { width: 28px; height: 28px; object-fit: contain; }
      .nest { text-align: center; padding-top: clamp(28px, 10vw, 48px); }
      .oddler { isolation: isolate; }
      /* On the prompt screen the Oddler peeks from the panel's corner so it can
         never push the question or sit under the keyboard. */
      .askfoot { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 2px; }
      .oddler.mini { width: 78px; margin: 0; flex: 0 0 auto; }
      @media (max-height: 600px) {
        .prompt { font-size: 20px; margin: 6px 0 4px; }
        .oddler.mini { display: none; }
      }

      /* play */
      .hud { display: flex; justify-content: space-between; align-items: center; font-family: var(--pixel); font-size: 10px; }
      .hud .score { color: var(--lime); }
      .strikes { letter-spacing: 3px; }
      .chip { display: inline-block; font-family: var(--pixel); font-size: 9px; padding: 5px 8px; border-radius: 6px; background: var(--purple); color: var(--cream); }
      .prompt { font-size: 24px; font-weight: 700; line-height: 1.25; margin: 10px 0 6px; }
      /* the clock */
      .clock { display: flex; align-items: center; gap: 14px; margin: 10px 0 10px; }
      .clock .bar { flex: 1; height: 14px; background: var(--purple); border-radius: 7px; overflow: hidden; border: 2px solid var(--line); }
      .clock .fill { height: 100%; width: 100%; background: var(--lime); transition: width 60ms linear; }
      .clock .count { font-family: var(--pixel); font-size: 40px; line-height: 1; min-width: 1.3em; text-align: center; color: var(--lime); text-shadow: 0 0 12px rgba(184,230,46,0.5); }
      .clock .count.punch { animation: punch 320ms cubic-bezier(.2,1.4,.4,1); }
      @keyframes punch { 0% { transform: scale(1.7); } 100% { transform: scale(1); } }
      .clock.warn .fill { background: var(--rust); }
      .clock.warn .count { color: var(--rust); text-shadow: 0 0 14px rgba(232,116,59,0.7); }
      .clock.danger .fill { background: #ff3b3b; }
      .clock.danger .count { color: #ff3b3b; text-shadow: 0 0 18px rgba(255,59,59,0.9); animation: throb 300ms ease-in-out infinite alternate; }
      @keyframes throb { from { transform: scale(1); } to { transform: scale(1.25); } }
      .panel.shake { animation: shake 90ms linear infinite; }
      @keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(2px,-1px); } 50% { transform: translate(-2px,1px); } 75% { transform: translate(1px,2px); } 100% { transform: translate(-1px,-2px); } }
      #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5; --urg: 0;
        background: radial-gradient(ellipse at center, rgba(255,40,40,0) 45%, rgba(255,40,40,0.55) 100%);
        opacity: calc(var(--urg) * 0.8); transition: opacity 120ms linear; }
      #vignette.danger { animation: flashvig 260ms ease-in-out infinite alternate; }
      @keyframes flashvig { from { opacity: 0.35; } to { opacity: 0.95; } }
      /* who is on the clock */
      .onclock { margin-top: 12px; padding: 12px 10px; border-radius: 10px; text-align: center; font-family: var(--pixel); font-size: 12px; letter-spacing: 0.04em; }
      .onclock.you { background: var(--lime); color: var(--plum); animation: glow 900ms ease-in-out infinite alternate; }
      .onclock.them { background: var(--purple); color: var(--cream); border: 2px solid var(--line); }
      @keyframes glow { from { box-shadow: 0 0 0 0 rgba(184,230,46,0.0); } to { box-shadow: 0 0 22px 4px rgba(184,230,46,0.55); } }
      .team .seat.turn { border-color: var(--lime); background: rgba(184,230,46,0.10); animation: glow 900ms ease-in-out infinite alternate; }
      .answer { display: flex; gap: 8px; }
      .answer input {
        flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 10px; padding: 14px 14px;
        background: rgba(27,16,38,0.9); color: var(--white); font-size: 18px;
      }
      .answer input::placeholder { color: var(--dim); }
      .answer button { flex: 0 0 auto; width: auto; padding: 0 18px; font-size: 11px; }
      .tries { min-height: 1.4em; font-size: 14px; color: var(--rust); }
      .tries .ok { color: var(--dim); }

      /* reveal */
      .tier { display: inline-block; font-family: var(--pixel); font-size: 11px; padding: 8px 10px; border-radius: 8px; color: var(--plum); }
      .tier.t0 { background: var(--slate); } .tier.t1 { background: var(--t1); } .tier.t2 { background: var(--t2); }
      .tier.t3 { background: var(--t3); color: var(--cream); } .tier.t4 { background: var(--t4); } .tier.t5 { background: var(--t5); } .tier.t6 { background: var(--t6); }
      .yours { font-size: 22px; font-weight: 700; }
      .pts { font-family: var(--pixel); font-size: 20px; color: var(--lime); }
      .earned { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 10px; border-radius: 10px; background: rgba(124,91,166,0.25); }
      .earned img { width: 56px; height: 56px; object-fit: contain; }
      .odder { margin-top: 10px; font-size: 15px; }
      .odder b { color: var(--cream); }

      /* results */
      .bigscore { font-family: var(--pixel); font-size: 34px; color: var(--lime); line-height: 1.2; }
      .ladder { display: flex; gap: 5px; flex-wrap: wrap; margin: 10px 0; }
      .ladder span { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-family: var(--pixel); font-size: 9px; color: var(--plum); }
      .history { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
      .history li { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid rgba(124,91,166,0.35); padding-top: 6px; }
      .history li span:last-child { white-space: nowrap; }
      .best { font-family: var(--pixel); font-size: 10px; color: var(--dim); }
      .best.new { color: var(--lime); }

      /* tutorial */
      .tut .ex { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
      .tut .ex button { background: var(--purple); border: 2px solid var(--line); border-radius: 10px; padding: 12px; color: var(--cream); font-size: 16px; }
      .tut .ex button[aria-pressed="true"] { border-color: var(--lime); }
      .ladderlist { display: grid; gap: 5px; margin: 10px 0; font-size: 14px; }
      .ladderlist div { display: flex; justify-content: space-between; align-items: center; }

      /* duo */
      .code { font-family: var(--pixel); font-size: 30px; letter-spacing: 0.18em; color: var(--lime); margin: 8px 0; }
      .team { display: flex; gap: 10px; justify-content: center; align-items: flex-end; padding-top: clamp(20px, 6vw, 34px); }
      .team .seat { flex: 1; text-align: center; border-radius: 12px; padding: 6px 4px 2px; border: 2px solid transparent; }
      .team .seat .oddler { width: min(36vw, 150px); }
      .team.compact { padding-top: 10px; margin-top: 6px; }
      .team.compact .seat .oddler.mini { width: 72px; margin: 0 auto; }
      .seatname { font-size: 9px; color: var(--dim); margin: 6px 0 0; }
      .seat.turn .seatname { color: var(--lime); }
      .waiting { display: grid; place-items: center; height: 100%; font-family: var(--pixel); font-size: 9px; line-height: 1.8; color: var(--dim); border: 2px dashed var(--line); border-radius: 12px; text-align: center; }
      .chip.lime { background: var(--lime); color: var(--plum); }
      .live { border: 2px solid var(--line); border-radius: 10px; padding: 10px 14px; background: rgba(27,16,38,0.9); min-height: 58px; }
      .livelabel { font-size: 8px; color: var(--dim); display: block; margin-bottom: 4px; }
      .livetext { font-size: 18px; color: var(--white); min-height: 1.4em; word-break: break-word; }
      .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--lime); vertical-align: text-bottom; margin-left: 2px; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .about { margin: 10px 0 14px; border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; }
      .about summary { cursor: pointer; font-weight: 700; }
      .about p { color: var(--dim); }
      @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }

      .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--lime); color: var(--plum); font-family: var(--pixel); font-size: 10px; padding: 10px 14px; border-radius: 8px; opacity: 0; transition: opacity 200ms; pointer-events: none; z-index: 10; }
      .toast.show { opacity: 1; }
      #status { font-family: var(--pixel); font-size: 9px; color: var(--dim); text-align: center; }
      #status.error { color: var(--rust); }
      @media (prefers-reduced-motion: reduce) {
        .oddler.idle, .oddler .part.new, .clock .count, .onclock.you, .team .seat.turn, #vignette, .panel.shake, .fanfare.up, .nameplate, .xpflash.show { animation: none; }
        .clock .fill, .oddler { transition: none; }
      }
      @media (min-width: 700px) {
        body { font-size: 18px; }
        .prompt { font-size: 28px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand">
          <img src="/art/logo.png" alt="Oddler" />
          <span class="tag">only odd answers score</span>
        </div>
        <button id="mute" class="iconbtn" type="button" aria-pressed="true" aria-label="Sound on">♪</button>
      </header>
      <main id="screen" aria-live="polite"></main>
      <p id="status"></p>
    </div>
    <div id="vignette" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status"></div>
